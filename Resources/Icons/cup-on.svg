<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18">
  <g fill="none" stroke="#000000" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">
    <!-- coffee fill: solid ellipse, slightly inset from rim, low alpha for liquid -->
    <ellipse cx="7.3" cy="7.4" rx="3.5" ry="1.25" fill="#000000" fill-opacity="0.55" stroke="none"/>
    <!-- top rim ellipse -->
    <ellipse cx="7.3" cy="7.4" rx="4.1" ry="1.5"/>
    <!-- body -->
    <path d="M3.3 7.5 L3.85 13.5 C4.05 14.55 5.55 15.3 7.3 15.3 C9.05 15.3 10.55 14.55 10.75 13.5 L11.3 7.5"/>
    <!-- handle -->
    <path d="M11.2 8.7 C13.3 8.7 14.25 10 14.05 11.5 C13.85 12.9 12.45 13.6 10.95 13.3"/>
    <!-- steam: two wavy lines, bold and prominent -->
    <path d="M5.6 5.6 C4.9 4.6 6.3 3.8 5.6 2.8 C4.9 1.8 6.3 1.2 5.6 0.5" stroke-opacity="0.85" stroke-width="1.3"/>
    <path d="M9 5.6 C8.3 4.6 9.7 3.8 9 2.8 C8.3 1.8 9.7 1.2 9 0.5" stroke-opacity="0.55" stroke-width="1.3"/>
  </g>
</svg>
